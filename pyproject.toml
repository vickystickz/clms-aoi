[build-system]
requires = ["setuptools>=69.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clms-aoi"
version = "0.1.0"
description = "Analyse Copernicus Land Monitoring Service products for an area of interest."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Victor Ademoyero" },
    { name = "Julia Wakaba" },
    { name = "Riya Pokhrel" },
]

dependencies = [
    "geopandas>=0.14",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyproj>=3.6",
    "requests>=2.31",
    "PyYAML>=6.0",
    "sentinelhub>=3.9",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/vickystickz/clms-aoi"
Issues = "https://github.com/vickystickz/clms-aoi/issues"

[project.scripts]
clms-aoi = "clms_aoi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clms_aoi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"clms_aoi.resources" = ["*.yaml", "*.geojson"]